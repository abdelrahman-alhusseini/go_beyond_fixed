name: go_beyond
description: A new Flutter project.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cloud_firestore: ^5.6.10
  firebase_auth: ^5.6.1
  firebase_core: ^3.15.0
  firebase_storage: 12.4.7
  cached_network_image: 3.4.1
  google_fonts: 6.3.3
  go_router: 12.1.3
  provider: 6.1.5
  table_calendar: 3.2.0
  intl: 0.20.2
  image_picker: 1.1.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/videos/
    - assets/audios/
    - assets/rive_animations/
    - assets/pdfs/
    - assets/jsons/